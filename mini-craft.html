<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>迷你建造世界</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    width: 100%; height: 100%;
    background: #7ec0ee;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #canvasWrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #hotbar {
    position: fixed;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: rgba(0,0,0,0.35);
    padding: 8px;
    border-radius: 14px;
    z-index: 10;
  }
  .hotslot {
    width: 44px; height: 44px;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.4);
  }
  .hotslot.selected {
    border-color: #fff;
    box-shadow: 0 0 8px 2px #fff;
  }

  #joystick {
    position: fixed;
    left: 24px; bottom: 24px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.5);
    z-index: 10;
  }
  #joystickKnob {
    position: absolute;
    left: 30px; top: 30px;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
  }

  #actionBtns {
    position: fixed;
    right: 20px; bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 10;
  }
  .actionBtn {
    width: 74px; height: 74px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    color: white;
    border: 2px solid rgba(255,255,255,0.5);
    font-size: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .actionBtn:active { background: rgba(0,0,0,0.6); }

  #lookZone {
    position: fixed;
    right: 0; top: 0;
    width: 60%; height: 100%;
    z-index: 5;
  }

  #hint {
    position: fixed;
    bottom: 10px; left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 0.8em;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    z-index: 10;
    text-align: center;
    max-width: 90%;
  }
  #startOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    color: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    text-align: center;
    padding: 20px;
  }
  #startOverlay h1 { margin-bottom: 6px; }
  #startOverlay button {
    margin-top: 20px;
    padding: 14px 36px;
    font-size: 1.2em;
    border: none;
    border-radius: 30px;
    background: #00b894;
    color: white;
  }
</style>
</head>
<body>
  <div id="startOverlay">
    <h1>⛏️ 迷你建造世界 🧱</h1>
    <p>所有建築道具已經全部贈送給你了！<br>左邊搖桿移動、右邊拖曳看方向。<br>下方按鈕：破壞 / 放置方塊，上方選擇要放的方塊種類。</p>
    <button id="startBtn">開始遊玩</button>
  </div>

  <div id="canvasWrap"></div>
  <div id="hotbar"></div>
  <div id="lookZone"></div>
  <div id="joystick"><div id="joystickKnob"></div></div>
  <div id="actionBtns">
    <div class="actionBtn" id="breakBtn">⛏️</div>
    <div class="actionBtn" id="placeBtn">🧱</div>
  </div>
  <div id="hint">左邊搖桿移動・右邊拖曳看方向・⛏️破壞　🧱放置</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  const overlayEl = document.getElementById('startOverlay');

  function showFatalError(msg) {
    overlayEl.innerHTML = '<h1>⚠️ 無法啟動遊戲</h1><p>' + msg + '</p>';
  }

  // 先確認 3D 引擎（Three.js，透過 CDN 載入）是否成功載入，
  // 沒載入的話直接顯示明確的錯誤訊息，而不是讓「開始遊玩」按鈕沒反應
  if (typeof THREE === 'undefined') {
    showFatalError('3D 引擎（Three.js）沒有載入成功，通常是網路被擋住或封鎖了 cdn.jsdelivr.net。<br>請確認裝置有連上網路，且瀏覽器/防火牆沒有封鎖 cdn.jsdelivr.net，然後重新整理頁面再試一次。');
    return;
  }

  try {
    initGame();
  } catch (err) {
    console.error(err);
    showFatalError('遊戲初始化時發生錯誤：' + (err && err.message ? err.message : err));
  }

  function initGame() {
  // ---------------- Block types (全部一開始就贈送給玩家) ----------------
  const BLOCK_TYPES = [
    { key: 'grass', name: '草地', color: 0x5fbf4a, icon: '🟩' },
    { key: 'dirt',  name: '泥土', color: 0x8b5a2b, icon: '🟫' },
    { key: 'stone', name: '石頭', color: 0x8d8d8d, icon: '⬜' },
    { key: 'wood',  name: '木頭', color: 0x9a6b3b, icon: '🟤' },
    { key: 'leaves',name: '樹葉', color: 0x2e7d32, icon: '🌳' },
    { key: 'sand',  name: '沙子', color: 0xe4d18a, icon: '🟨' },
    { key: 'glass', name: '玻璃', color: 0xaee3f2, icon: '🟦' },
    { key: 'brick', name: '磚塊', color: 0xb5432b, icon: '🧱' },
    { key: 'gold',  name: '金磚', color: 0xffd700, icon: '🟡' },
  ];

  let selectedBlockIdx = 0;

  const hotbarEl = document.getElementById('hotbar');
  BLOCK_TYPES.forEach((b, i) => {
    const slot = document.createElement('div');
    slot.className = 'hotslot' + (i === 0 ? ' selected' : '');
    slot.textContent = b.icon;
    slot.addEventListener('pointerdown', () => {
      selectedBlockIdx = i;
      document.querySelectorAll('.hotslot').forEach(s => s.classList.remove('selected'));
      slot.classList.add('selected');
    });
    hotbarEl.appendChild(slot);
  });

  // ---------------- Three.js setup ----------------
  const canvasWrap = document.getElementById('canvasWrap');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7ec0ee);
  scene.fog = new THREE.Fog(0x7ec0ee, 20, 55);

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  canvasWrap.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444422, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(20, 30, 10);
  scene.add(sun);

  // ---------------- Small voxel world ----------------
  const WORLD_SIZE = 12; // 世界不大：12x12
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const materials = {};
  BLOCK_TYPES.forEach(b => {
    materials[b.key] = new THREE.MeshLambertMaterial({
      color: b.color,
      transparent: b.key === 'glass',
      opacity: b.key === 'glass' ? 0.55 : 1,
    });
  });

  // voxels: Map "x,y,z" -> { key, mesh }
  const voxels = new Map();
  function keyOf(x, y, z) { return x + ',' + y + ',' + z; }

  function addBlock(x, y, z, blockKey, silent) {
    const k = keyOf(x, y, z);
    if (voxels.has(k)) return;
    const mesh = new THREE.Mesh(geometry, materials[blockKey]);
    mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
    scene.add(mesh);
    voxels.set(k, { key: blockKey, mesh });
  }

  function removeBlockAt(x, y, z) {
    const k = keyOf(x, y, z);
    const v = voxels.get(k);
    if (!v) return;
    scene.remove(v.mesh);
    voxels.delete(k);
  }

  function columnHeight(x, z) {
    let h = -1;
    for (let y = 0; y < 8; y++) {
      if (voxels.has(keyOf(x, y, z))) h = y;
    }
    return h;
  }

  // 產生小小的起伏地形 + 一棵樹
  for (let x = 0; x < WORLD_SIZE; x++) {
    for (let z = 0; z < WORLD_SIZE; z++) {
      const h = 1 + Math.round(Math.sin(x * 0.5) + Math.cos(z * 0.5)) % 2;
      const height = Math.max(1, h);
      for (let y = 0; y < height; y++) {
        const key = (y === height - 1) ? 'grass' : (y === 0 ? 'stone' : 'dirt');
        addBlock(x, y, z, key);
      }
    }
  }
  // 一棵小樹當範例
  const treeX = Math.floor(WORLD_SIZE / 2), treeZ = Math.floor(WORLD_SIZE / 2);
  const baseY = columnHeight(treeX, treeZ) + 1;
  for (let i = 0; i < 3; i++) addBlock(treeX, baseY + i, treeZ, 'wood');
  for (let lx = -1; lx <= 1; lx++) {
    for (let lz = -1; lz <= 1; lz++) {
      addBlock(treeX + lx, baseY + 3, treeZ + lz, 'leaves');
    }
  }
  addBlock(treeX, baseY + 4, treeZ, 'leaves');

  // ---------------- Player (第一人稱，簡易貼地移動) ----------------
  const player = {
    x: WORLD_SIZE / 2, z: -3, yaw: 0, pitch: -0.1,
    eyeHeight: 1.7,
  };
  camera.position.set(player.x, player.eyeHeight, player.z);

  function updateCamera() {
    const groundH = Math.max(0, columnHeight(Math.round(player.x), Math.round(player.z)) + 1);
    camera.position.set(player.x, groundH + player.eyeHeight, player.z);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
  }
  updateCamera();

  // ---------------- Joystick (移動) ----------------
  const joystick = document.getElementById('joystick');
  const knob = document.getElementById('joystickKnob');
  let moveVec = { x: 0, y: 0 };
  let joyTouchId = null;

  function joystickPos(e) {
    const rect = joystick.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const max = rect.width / 2;
    const dist = Math.min(max, Math.hypot(dx, dy));
    const angle = Math.atan2(dy, dx);
    dx = Math.cos(angle) * dist;
    dy = Math.sin(angle) * dist;
    knob.style.left = (30 + dx) + 'px';
    knob.style.top = (30 + dy) + 'px';
    moveVec.x = dx / max;
    moveVec.y = dy / max;
  }
  function resetJoystick() {
    knob.style.left = '30px';
    knob.style.top = '30px';
    moveVec.x = 0; moveVec.y = 0;
    joyTouchId = null;
  }
  joystick.addEventListener('pointerdown', (e) => {
    joyTouchId = e.pointerId;
    joystickPos(e);
  });
  window.addEventListener('pointermove', (e) => {
    if (e.pointerId === joyTouchId) joystickPos(e);
  });
  window.addEventListener('pointerup', (e) => {
    if (e.pointerId === joyTouchId) resetJoystick();
  });

  // ---------------- Look (拖曳視角) ----------------
  const lookZone = document.getElementById('lookZone');
  let lookTouchId = null;
  let lastLookX = 0, lastLookY = 0;
  lookZone.addEventListener('pointerdown', (e) => {
    lookTouchId = e.pointerId;
    lastLookX = e.clientX; lastLookY = e.clientY;
  });
  window.addEventListener('pointermove', (e) => {
    if (e.pointerId !== lookTouchId) return;
    const dx = e.clientX - lastLookX;
    const dy = e.clientY - lastLookY;
    lastLookX = e.clientX; lastLookY = e.clientY;
    player.yaw -= dx * 0.005;
    player.pitch -= dy * 0.005;
    player.pitch = Math.max(-1.3, Math.min(1.3, player.pitch));
  });
  window.addEventListener('pointerup', (e) => {
    if (e.pointerId === lookTouchId) lookTouchId = null;
  });

  // ---------------- Raycast target (準心對到的方塊面) ----------------
  const raycaster = new THREE.Raycaster();
  function getTargetedFace() {
    raycaster.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));
    const meshes = [];
    voxels.forEach(v => meshes.push(v.mesh));
    const hits = raycaster.intersectObjects(meshes, false);
    if (hits.length === 0 || hits[0].distance > 6) return null;
    return hits[0];
  }

  document.getElementById('breakBtn').addEventListener('pointerdown', () => {
    const hit = getTargetedFace();
    if (!hit) return;
    const p = hit.object.position;
    removeBlockAt(Math.round(p.x - 0.5), Math.round(p.y - 0.5), Math.round(p.z - 0.5));
  });

  document.getElementById('placeBtn').addEventListener('pointerdown', () => {
    const hit = getTargetedFace();
    if (!hit) return;
    const p = hit.object.position.clone().add(hit.face.normal);
    const x = Math.round(p.x - 0.5), y = Math.round(p.y - 0.5), z = Math.round(p.z - 0.5);
    if (x < 0 || z < 0 || x >= WORLD_SIZE || z >= WORLD_SIZE || y < 0 || y > 12) return;
    addBlock(x, y, z, BLOCK_TYPES[selectedBlockIdx].key);
  });

  // ---------------- Start overlay ----------------
  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startOverlay').style.display = 'none';
  });

  // ---------------- Resize ----------------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------------- Main loop ----------------
  function animate() {
    requestAnimationFrame(animate);

    const speed = 0.08;
    if (Math.abs(moveVec.x) > 0.05 || Math.abs(moveVec.y) > 0.05) {
      const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
      const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
      const nx = player.x - forward.x * moveVec.y * speed + right.x * moveVec.x * speed;
      const nz = player.z - forward.z * moveVec.y * speed + right.z * moveVec.x * speed;
      player.x = Math.max(0.5, Math.min(WORLD_SIZE - 0.5, nx));
      player.z = Math.max(0.5, Math.min(WORLD_SIZE - 0.5, nz));
    }
    updateCamera();
    renderer.render(scene, camera);
  }
  animate();
  } // end initGame
})();
</script>
</body>
</html>
